<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17302C">
<title>Almanac</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EA; --surface:#F8F9F5; --ink:#17302C; --muted:#5C6F69; --line:#CFD6CC;
  --men:#A8324A; --fol:#4F8A62; --ovu:#C98F22; --lut:#6A5A82;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1F1D; --surface:#172C29; --ink:#E6EDE6; --muted:#9BADA6; --line:#2B443F;
    --men:#E0637B; --fol:#7FBF92; --ovu:#E8B85A; --lut:#A594C4;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ovu);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.15}
h2{font-size:1.5rem}
h3{font-size:1.125rem;margin-top:1.75rem}
p{margin:.5rem 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
header.top .name{font-family:var(--display);font-size:1.25rem;font-weight:600}
.iconbtn{background:none;border:0;padding:8px;border-radius:50%;display:flex;align-items:center;gap:6px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.syncdot.on{background:var(--fol)} .syncdot.pending{background:var(--ovu)}
main{flex:1;padding:8px 20px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none} .view.active{display:block}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs div{display:flex;width:100%;max-width:520px}
nav.tabs button{flex:1;background:none;border:0;padding:12px 4px 14px;font-size:.8125rem;font-weight:500;color:var(--muted);
  border-top:2px solid transparent;margin-top:-1px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink);font-weight:600}

/* Today */
.dial{display:block;width:min(78vw,300px);margin:8px auto 0}
.dial text{font-family:var(--display);fill:var(--ink)}
.dial .lbl{font-family:var(--body);fill:var(--muted);font-size:13px}
.status{text-align:center;margin:6px 0 18px}
.status .line1{font-weight:600}
.btn{display:block;width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--ink);font-weight:500}
.btn + .btn{margin-top:10px}
.logged{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tag{font-size:.8125rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
ul.tips{list-style:none;padding:0;margin:.75rem 0 0}
ul.tips li{padding:14px 0;border-top:1px solid var(--line)}
ul.tips li:last-child{border-bottom:1px solid var(--line)}
ul.tips b{display:block;font-weight:600}
ul.tips span{color:var(--muted);font-size:.9375rem}
.phasebar{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}

/* Calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.calhead button{background:none;border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .dow{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;border:0;background:none;border-radius:50%;position:relative;font-size:.9375rem;display:flex;align-items:center;justify-content:center}
.day.per{background:var(--men);color:#fff;font-weight:600}
.day.spot{box-shadow:inset 0 0 0 2px var(--men)}
.day.pper{box-shadow:inset 0 0 0 1.5px var(--men);border-radius:50%;opacity:.75}
.day.pper{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--men) 22%,transparent) 4px 8px)}
.day.fert::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ovu)}
.day.ovu{box-shadow:inset 0 0 0 2px var(--ovu)}
.day.has::before{content:"";position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.day.per.has::before{background:#fff}
.day.today{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.day:disabled{color:var(--muted);cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:.8125rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}

/* Patterns */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin:12px 0 4px}
.stats div b{display:block;font-family:var(--display);font-size:1.75rem;font-weight:600;line-height:1.1}
.stats div span{font-size:.875rem;color:var(--muted)}
.bars{margin-top:10px}
.barrow{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:10px;padding:5px 0;font-size:.875rem}
.barrow .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.barrow .fill{height:100%;border-radius:5px}
.barrow .v{text-align:right;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;margin-top:14px;color:var(--muted)}

/* Learn */
.phasepick{display:flex;gap:6px;overflow-x:auto;margin:10px -20px 0;padding:0 20px 4px}
.phasepick button{white-space:nowrap;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:.875rem}
.phasepick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.learn ul{padding-left:1.1rem;margin:.5rem 0}
.learn li{margin:.5rem 0}
.learn li b{font-weight:600}
.note{font-size:.8125rem;color:var(--muted);border-top:1px solid var(--line);margin-top:28px;padding-top:12px}

/* Sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet.open{display:block}
.sheet .inner{max-width:520px;margin:0 auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheethead button{background:none;border:0;padding:8px 0;font-weight:600}
.field{margin-top:22px}
.field > label, .field > .lab{display:block;font-weight:600;margin-bottom:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:none;padding:11px 2px;font-size:.875rem;min-width:0}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg.flow button[aria-pressed="true"]{background:var(--men);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:.9375rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:12px;align-items:center}
.row input[type=number]{width:96px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{background:none;border:1px solid var(--line);border-radius:50%;width:40px;height:40px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9375rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="name">Almanac</span>
    <button class="iconbtn" id="openAccount" aria-label="Backup and account">
      <span class="syncdot" id="syncdot"></span><span class="small" id="synclabel">Backup</span>
    </button>
  </header>
  <main>
    <section class="view active" id="v-today"></section>
    <section class="view" id="v-calendar"></section>
    <section class="view" id="v-patterns"></section>
    <section class="view learn" id="v-learn"></section>
  </main>
</div>
<nav class="tabs" aria-label="Sections"><div>
  <button data-tab="today" aria-current="page">Today</button>
  <button data-tab="calendar">Calendar</button>
  <button data-tab="patterns">Patterns</button>
  <button data-tab="learn">Learn</button>
</div></nav>

<div class="sheet" id="logsheet" role="dialog" aria-modal="true" aria-label="Daily log"><div class="inner" id="loginner"></div></div>
<div class="sheet" id="acctsheet" role="dialog" aria-modal="true" aria-label="Backup and account"><div class="inner" id="acctinner"></div></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";

  const pdays = Object.keys(logs).filter(d => isPeriod(getLog(d))).sort();

/* ---------- content ---------- */
const PH = {

  if (!l) return t;
  if ((l.pain|0) >= 3) t.push(["For today's cramps","Start heat now and, if anti-inflammatories are safe for you, take them with food sooner rather than later. They block the prostaglandins causing the pain, so early doses work better."]);

/* ---------- views ---------- */
let tab = "today", calMonth = today().slice(0,7), learnPhase = null;

function arcPath(f0, f1, r=118, cx=150, cy=150){
  const a0 = f0*2*Math.PI - Math.PI/2, a1 = f1*2*Math.PI - Math.PI/2;

function dial(p){
  let arcs = `<circle cx="150" cy="150" r="118" fill="none" stroke="var(--line)" stroke-width="12"/>`, mark = "", mid;
  if (p){
    const L = Math.max(p.L, p.day), g = 0.006;

    arcs = segs.filter(s => s[2] > s[1]).map(s => `<path d="${arcPath(s[1]/L+g, s[2]/L-g)}" fill="none" stroke="var(--${s[0]})" stroke-width="12" stroke-linecap="round"/>`).join("");
    const f = (p.day-0.5)/L, a = f*2*Math.PI - Math.PI/2;

    mid = `<text x="150" y="150" text-anchor="middle" font-size="64" font-weight="600">${p.day}</text>

}
function logTags(l){

  (l.mood||[]).forEach(x => t.push(x));
  (l.skin||[]).forEach(x => t.push(`Skin: ${x.toLowerCase()}`));
  (l.crave||[]).forEach(x => t.push(`Craving ${x.toLowerCase()}`));
  if (l.cravetext) t.push(`Craving ${l.cravetext}`);

}
function renderToday(){

    else { const n = diff(m.next, t); l1 = `Next period in ${n} day${n>1?"s":""}, around ${nice(m.next)}`; }
    const range = m.sd !== null ? `Your cycles vary by about ${Math.max(1, Math.round(m.sd))} day${Math.round(m.sd)>1?"s":""}.` : (m.clen.length ? "" : "Using a 28 day estimate until you have logged two periods.");

function renderCalendar(){

function renderPatterns(){
  const m = model(), el = $("#v-patterns");
  const days = Object.keys(logs).filter(d => getLog(d)).sort();
  let html = `<h2>Patterns</h2>`;
  if (m.starts.length < 2 || !m.clen.length){
    el.innerHTML = html + `<div class="empty">Patterns appear once two periods are logged. You have logged ${m.starts.length}. Daily entries between periods make the patterns sharper.</div>`;
    return;
  }
  const cmin = Math.min(...m.clen), cmax = Math.max(...m.clen);
  html += `<div class="stats">
    <div><b>${m.avgCycle} days</b><span>Average cycle${m.clen.length>1 ? `, ranging ${cmin} to ${cmax}` : ""}</span></div>
    <div><b>${m.avgPeriod} days</b><span>Average period</span></div>
    <div><b>${m.clen.length}</b><span>Full cycle${m.clen.length>1?"s":""} tracked</span></div>
    <div><b>${nice(m.next)}</b><span>Next period estimate</span></div></div>`;
  // cycle history
  html += `<h3>Cycle lengths</h3><div class="bars">` + m.clen.slice(-8).map((L,i,arr) => {
    const s = m.starts[m.starts.length - 1 - (arr.length - i)];
    return `<div class="barrow"><span>${nice(s)}</span><div class="track"><div class="fill" style="width:${Math.min(100,L/45*100)}%;background:var(--ink)"></div></div><span class="v">${L} d</span></div>`;
  }).join("") + `</div>`;
  // per phase
  const by = {menstrual:[],follicular:[],ovulatory:[],luteal:[]};
  days.forEach(d => { const p = phaseAt(d, m); if (p && !p.predicted) by[p.phase].push([d, getLog(d), p]); });
  const avg = (ph, k) => { const v = by[ph].map(x => x[1][k]).filter(x => x !== undefined && x !== null && x !== ""); return v.length ? mean(v.map(Number)) : null; };
  const block = (title, k, max, unit) => {
    const rows = Object.keys(by).map(ph => [ph, avg(ph,k)]).filter(r => r[1] !== null);
    if (rows.length < 2) return "";
    return `<h3>${title}</h3><div class="bars">` + rows.map(([ph,v]) =>
      `<div class="barrow"><span>${PH[ph].name}</span><div class="track"><div class="fill" style="width:${Math.min(100,v/max*100)}%;background:${PH[ph].color}"></div></div><span class="v">${v.toFixed(1)}${unit}</span></div>`).join("") + `</div>`;
  };
  html += block("Average pain by phase","pain",5,"") + block("Average energy by phase","energy",5,"") + block("Average sleep by phase","sleeph",10," h");
  // insights
  const feats = {};
  const add = (name, d, ph) => { (feats[name] = feats[name] || []).push([d, ph]); };
  const total = Object.values(by).reduce((a,b)=>a+b.length,0);
  Object.keys(by).forEach(ph => by[ph].forEach(([d,l]) => {
    if ((l.pain|0) >= 3) add("Stronger pain", d, ph);
    if (l.energy && l.energy <= 2) add("Low energy", d, ph);
    if (l.sleepq && l.sleepq <= 2) add("Poor sleep", d, ph);
    (l.mood||[]).forEach(x => add(`Feeling ${x.toLowerCase()}`, d, ph));
    (l.skin||[]).filter(x => x !== "Clear").forEach(x => add(`${x} skin`, d, ph));
    (l.crave||[]).forEach(x => add(`${x} cravings`, d, ph));
  }));
  const ins = [];
  Object.entries(feats).forEach(([name, occ]) => {
    if (occ.length < 3) return;
    const pre = occ.filter(([d]) => m.starts.some(s => { const k = diff(s, d); return k >= 1 && k <= 3; })).length;
    if (pre / occ.length >= 0.5){ ins.push(`${name}: usually in the 3 days before your period (${pre} of ${occ.length} times).`); return; }
    let best = null;
    Object.keys(by).forEach(ph => { const c = occ.filter(o => o[1] === ph).length, dn = by[ph].length; if (dn && (!best || c/dn > best.r)) best = { ph, c, dn, r: c/dn }; });
    if (best && best.c >= 2 && best.r >= 1.5 * (occ.length/total)) ins.push(`${name}: most common in your ${PH[best.ph].name.toLowerCase()} phase (${best.c} of ${best.dn} logged days).`);
  });
  html += `<h3>What your logs suggest</h3>` + (ins.length
    ? `<ul class="tips">${ins.slice(0,8).map(x => `<li><span style="color:var(--ink)">${esc(x)}</span></li>`).join("")}</ul>`
    : `<div class="empty">Nothing stands out yet. Patterns need a symptom logged at least three times.</div>`);
  html += `<p class="note">Patterns are drawn only from your own entries and show timing, not cause.</p>`;
  el.innerHTML = html;
}

function readInputs(){

function saveLog(){
  readInputs();

  if (!Object.keys(draft).length){ if (logs[draftDate]) setLog(draftDate, {_deleted:true}); }
  else setLog(draftDate, draft);
  closeSheets(); render(); toast("Log saved");

/* ---------- sync ---------- */
let sb = null, session = null, syncing = false, lastSync = null;
function syncUI(){
  const dirty = Object.values(logs).some(x => x.dirty), dot = $("#syncdot");
  dot.className = "syncdot" + (session ? (dirty ? " pending" : " on") : "");
  $("#synclabel").textContent = session ? (dirty ? "Waiting to back up" : "Backed up") : "Backup off";
}
async function sync(manual){
  syncUI();
  if (!sb || !session || syncing) { if (manual && !session) toast("Sign in to back up"); return; }
  if (!navigator.onLine){ if (manual) toast("You are offline. Entries are saved on this phone."); return; }
  syncing = true;
  try {
    const { data: rows, error } = await sb.from("daily_logs").select("log_date,data,updated_at");
    if (error) throw error;
    let changed = false;
    rows.forEach(r => { const loc = logs[r.log_date];
      if (!loc || new Date(r.updated_at) > new Date(loc.u)){ logs[r.log_date] = { data: r.data || {}, u: r.updated_at, dirty: false }; changed = true; } });
    const up = Object.entries(logs).filter(([,v]) => v.dirty).map(([d,v]) => ({ user_id: session.user.id, log_date: d, data: v.data, updated_at: v.u }));
    if (up.length){
      const { error: e2 } = await sb.from("daily_logs").upsert(up, { onConflict: "user_id,log_date" });
      if (e2) throw e2;
      up.forEach(r => { if (logs[r.log_date] && logs[r.log_date].u === r.updated_at) logs[r.log_date].dirty = false; });
    }
    persist(); lastSync = new Date();
    if (changed) render();
    if (manual) toast("Backed up");
  } catch(e){ if (manual) toast("Backup failed: " + (e.message || "try again")); }
  syncing = false; syncUI();
  if ($("#acctsheet").classList.contains("open")) renderAccount();
}
function renderAccount(msg){
  const count = Object.keys(logs).filter(d => getLog(d)).length;
  let body;
  if (!sb) body = `<p class="muted">Backup needs an internet connection the first time. Your entries are still saved on this phone.</p>`;
  else if (session) body = `<p>Signed in as <b>${esc(session.user.email)}</b>.</p>
      <p class="muted small">${lastSync ? "Last backed up " + lastSync.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) + "." : "Not backed up yet this session."}</p>
      <button class="btn" data-syncnow>Back up now</button><button class="btn quiet" data-signout>Sign out</button>`;
  else body = `<p class="muted">Sign in to back up your entries privately. Only your account can read them.</p>
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8"></div>
      <div class="field"><button class="btn" data-signin>Sign in</button><button class="btn ghost" data-signup>Create account</button></div>`;
  $("#acctinner").innerHTML = `<div class="sheethead"><button type="button" data-close>Close</button><span></span></div>
    <h2>Backup and account</h2>${msg ? `<p role="alert"><b>${esc(msg)}</b></p>` : ""}${body}
    <h3>On this phone</h3><p class="muted">${count} day${count===1?"":"s"} logged.</p>
    <button class="btn quiet" data-export>Download a copy of my data</button>
    <label class="btn quiet" style="margin-top:10px">Restore from a copy<input type="file" id="importfile" accept="application/json,.json" hidden></label>`;
}
async function auth(kind){
  const email = $("#em").value.trim(), password = $("#pw").value;
  if (!email || password.length < 8) return renderAccount("Enter your email and a password of at least 8 characters.");
  const res = kind === "up"
    ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } })
    : await sb.auth.signInWithPassword({ email, password });
  if (res.error) return renderAccount(res.error.message);
  if (kind === "up" && !res.data.session) return renderAccount("Check your email and tap the confirmation link, then come back here and sign in.");
}
function initSync(){
  if (!window.supabase) return syncUI();
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  sb.auth.onAuthStateChange((_e, s) => { session = s; syncUI(); if ($("#acctsheet").classList.contains("open")) renderAccount(); if (s) setTimeout(() => sync(), 0); });
  window.addEventListener("online", () => sync());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { sync(); render(); } });
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go);
  if (d.log) return openLog(d.log);
  if (d.cal){ const [y,m] = calMonth.split("-").map(Number); const n = new Date(y, m-1+Number(d.cal), 1); calMonth = `${n.getFullYear()}-${pad(n.getMonth()+1)}`; return renderCalendar(); }
  if (d.phase){ learnPhase = d.phase; return renderLearn(); }
  if ("close" in d) return closeSheets();
  if ("save" in d) return saveLog();
  if ("clear" in d){ setLog(draftDate, {_deleted:true}); closeSheets(); render(); return toast("Day cleared"); }
  if (d.shift){ readInputs(); return openLog(addDays(draftDate, Number(d.shift))); }
  if (d.seg){ const v = Number(d.v); draft[d.seg] = draft[d.seg] === v ? 0 : v;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(Number(x.dataset.v) === (draft[d.seg]||0) && (draft[d.seg] !== 0 || x.dataset.v === "0")))); return; }
  if (d.chip){ const a = draft[d.chip] = draft[d.chip] || [], i = a.indexOf(d.v); i >= 0 ? a.splice(i,1) : a.push(d.v); b.setAttribute("aria-pressed", String(i < 0)); return; }
  if (b.id === "openAccount"){ renderAccount(); return $("#acctsheet").classList.add("open"); }
  if ("signin" in d) return auth("in");
  if ("signup" in d) return auth("up");
  if ("signout" in d) return sb.auth.signOut();
  if ("syncnow" in d) return sync(true);
  if ("export" in d){
    const blob = new Blob([JSON.stringify(logs, null, 1)], {type:"application/json"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `almanac-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
});
document.addEventListener("change", e => {
  if (e.target.id !== "importfile" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try {
      const inc = JSON.parse(r.result); let n = 0;
      Object.entries(inc).forEach(([d,v]) => { if (/^\d{4}-\d\d-\d\d$/.test(d) && v && typeof v.data === "object" && (!logs[d] || new Date(v.u) > new Date(logs[d].u))){ logs[d] = { data: v.data, u: v.u || new Date().toISOString(), dirty: true }; n++; } });
      persist(); render(); renderAccount(`Restored ${n} day${n===1?"":"s"}.`); sync();
    } catch(err){ renderAccount("That file could not be read. Choose a copy downloaded from this app."); } };
  r.readAsText(e.target.files[0]);
});

render(); initSync();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
